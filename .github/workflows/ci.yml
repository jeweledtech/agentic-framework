name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install package with dev deps
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests with coverage
      env:
        USE_MOCK_KB: "true"
        ENABLE_AUTH: "false"
      run: |
        pytest tests/ -v --tb=short --cov=core --cov=api_server --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install pylint black isort

    - name: Lint with pylint
      run: |
        pylint agents/ core/ tools/ --disable=C0111,R0903,W0223,C0114,C0115,C0116,R0801,W0612,W0611,E0401,C0301 --exit-zero

    - name: Format check with black
      run: |
        black --check agents/ core/ tools/ --line-length 120 || true

    - name: Sort imports with isort
      run: |
        isort --check-only agents/ core/ tools/ || true

  docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -f Dockerfile -t agentic-framework:test .

    - name: Validate Docker Compose config
      run: |
        docker compose config

    - name: Test Docker image runs
      run: |
        # Run with mock mode enabled so it doesn't need Ollama.
        # Auth fails closed, so the server refuses to start without a key;
        # give it a throwaway CI-only key.
        docker run -d --name test-api \
          -e USE_MOCK_KB=true \
          -e FRAMEWORK_API_KEY=ci-smoke-test-key \
          -e OLLAMA_HOST=http://localhost:11434 \
          -p 8000:8000 \
          agentic-framework:test

        # Wait for startup
        echo "Waiting for container to start..."
        sleep 20

        # Show container status
        echo "Container status:"
        docker ps -a | grep test-api || true

        # Show logs regardless of status
        echo "Container logs:"
        docker logs test-api 2>&1 || true

        # Check if container is still running
        if ! docker ps | grep -q test-api; then
          echo "Container is not running!"
          exit 1
        fi

        # Check health endpoint
        echo "Testing health endpoint..."
        curl -f http://localhost:8000/health || exit 1

        # Protected route must reject a missing key and accept a valid one
        echo "Testing auth enforcement..."
        code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/agents)
        if [ "$code" != "401" ] && [ "$code" != "403" ]; then
          echo "Expected 401/403 without API key, got $code"; exit 1
        fi
        curl -f -H "X-API-Key: ci-smoke-test-key" http://localhost:8000/agents > /dev/null || exit 1

        # Cleanup
        docker stop test-api
        docker rm test-api

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'
